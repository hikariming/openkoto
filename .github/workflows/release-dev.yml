# 开发版本构建工作流
# 用于测试新功能，不会触发用户更新弹窗
# 使用方法：git tag dev-xxx && git push origin dev-xxx
name: "publish-dev"

on:
  push:
    tags:
      - 'dev-*'   # 匹配 dev-xxx 格式的 tag

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: textlingo-desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./textlingo-desktop

      - name: Typecheck
        run: npm run typecheck
        working-directory: ./textlingo-desktop

      - name: Download sidecar binaries
        run: |
          chmod +x script/download_binaries.sh
          bash script/download_binaries.sh
        shell: bash

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust tests
        run: cargo test --all-features --all-targets
        working-directory: ./textlingo-desktop/src-tauri

      - name: Rust coverage gate (>=90%)
        run: cargo llvm-cov --workspace --all-features --all-targets --summary-only --fail-under-lines 90
        working-directory: ./textlingo-desktop/src-tauri

      - name: Frontend coverage gate (>=80%)
        run: npm run coverage
        working-directory: ./textlingo-desktop

  publish-tauri:
    needs: ci-gate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "macos-14"
            rust_targets: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - os: "macos-13"
            rust_targets: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
          - os: "windows-latest"
            rust_targets: ""
            args: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: install dependencies (macos only)
        if: startsWith(matrix.os, 'macos')
        run: brew install create-dmg


      - name: install frontend dependencies
        run: npm install
        working-directory: ./textlingo-desktop

      - name: download sidecar binaries
        run: |
          chmod +x script/download_binaries.sh
          bash script/download_binaries.sh
        shell: bash

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "🧪 Dev Build ${{ github.ref_name }}"
          releaseBody: |
            ⚠️ **开发测试版本 / Development Build**
            
            此版本仅供开发测试使用，不建议普通用户安装。
            This is a development build for testing purposes only.
            
            ---
            Tag: `${{ github.ref_name }}`
          releaseDraft: false
          prerelease: true   # 关键：标记为预发布，不会触发用户更新弹窗
          projectPath: "./textlingo-desktop"
          args: ${{ matrix.args }}

      - name: Build Plugins (MacOS ARM64)
        if: matrix.os == 'macos-14' && contains(matrix.args, 'aarch64')
        run: |
          # Install Python
          brew install python@3.10
          # Create venv and install dependencies
          python3.10 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install pyinstaller
          cd plugins/openkoto-pdf-translator
          pip install .
          # Build binary
          python3 build.py
          # Move binary to root of plugin and rename to match plugin.json expectation
          # Note: build.py outputs to dist/openkoto-pdf-translator-macos-arm64
          mv dist/openkoto-pdf-translator-macos-arm64 ./openkoto-pdf-translator
          # Cleanup dist and build folders to keep zip clean
          rm -rf dist build venv
          
      - name: Zip Plugins
        if: matrix.os == 'macos-14' && contains(matrix.args, 'aarch64')
        run: zip -r plugins.zip plugins/

      - name: Upload Plugin to Release
        if: matrix.os == 'macos-14' && contains(matrix.args, 'aarch64')
        uses: softprops/action-gh-release@v1
        with:
          files: plugins.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
