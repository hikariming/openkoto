name: ci

on:
  push:
    branches:
      - main
      - "feature/**"
      - "codex/**"
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./textlingo-desktop/src-tauri
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download sidecar binaries
        working-directory: .
        run: |
          chmod +x script/download_binaries.sh
          bash script/download_binaries.sh

      - name: build bundled PDF sidecar
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install 'bitstring>=4.3.0,<5' -e ./textlingo-desktop/pdf-sidecar
          cd textlingo-desktop/pdf-sidecar
          python build.py
          cd ../..
          chmod +x script/sync_pdf_sidecar_binaries.sh
          bash script/sync_pdf_sidecar_binaries.sh
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"

      - name: verify bundled PDF sidecar
        working-directory: .
        run: |
          bash script/sync_pdf_sidecar_binaries.sh
          bash script/verify_pdf_sidecar_binary.sh
          ls -la textlingo-desktop/src-tauri/binaries
        shell: bash

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            textlingo-desktop/package-lock.json
            textlingo-desktop/agent-worker/package-lock.json

      - name: install agent worker dependencies
        run: npm ci
        working-directory: ./textlingo-desktop/agent-worker

      - name: stage bundled agent worker
        run: npm run stage
        working-directory: ./textlingo-desktop/agent-worker

      - name: Prepare frontend dist for Tauri context
        working-directory: .
        run: mkdir -p textlingo-desktop/dist

      - name: Rust tests
        run: cargo test --all-features --all-targets

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./textlingo-desktop
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: textlingo-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend test + coverage gate
        run: npm run coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npm run e2e
