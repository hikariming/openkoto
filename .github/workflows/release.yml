name: "publish"

on:
  push:
    tags:
      - 'v*'

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: textlingo-desktop/package-lock.json

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./textlingo-desktop

      - name: Typecheck
        run: npm run typecheck
        working-directory: ./textlingo-desktop

      - name: Download sidecar binaries
        run: |
          chmod +x script/download_binaries.sh
          bash script/download_binaries.sh

      - name: build bundled PDF sidecar
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ./textlingo-desktop/pdf-sidecar
          cd textlingo-desktop/pdf-sidecar
          python build.py
          cd ../..
          chmod +x script/sync_pdf_sidecar_binaries.sh
          bash script/sync_pdf_sidecar_binaries.sh
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"

      - name: verify bundled PDF sidecar
        run: |
          bash script/sync_pdf_sidecar_binaries.sh
          bash script/verify_pdf_sidecar_binary.sh
          ls -la textlingo-desktop/src-tauri/binaries
        shell: bash

      - name: Prepare frontend dist for Tauri context
        run: mkdir -p textlingo-desktop/dist

      - name: Rust tests
        run: cargo test --all-features --all-targets
        working-directory: ./textlingo-desktop/src-tauri

      - name: Frontend coverage gate (>=80%)
        run: npm run coverage
        working-directory: ./textlingo-desktop

  publish-tauri:
    needs: ci-gate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-14"
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          - platform: "macos-15-intel"
            args: "--target x86_64-apple-darwin --bundles app,dmg"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (macos only)
        if: startsWith(matrix.platform, 'macos-')
        run: brew install create-dmg

      - name: import Apple Developer ID certificate (macos only)
        if: startsWith(matrix.platform, 'macos-')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: prepare Apple notarization key (macos only)
        if: startsWith(matrix.platform, 'macos-')
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8" >> "$GITHUB_ENV"

      - name: install frontend dependencies
        run: npm install
        working-directory: ./textlingo-desktop

      - name: download sidecar binaries
        run: |
          chmod +x script/download_binaries.sh
          bash script/download_binaries.sh
        shell: bash

      - name: build bundled PDF sidecar
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ./textlingo-desktop/pdf-sidecar
          cd textlingo-desktop/pdf-sidecar
          python build.py
          cd ../..
          chmod +x script/sync_pdf_sidecar_binaries.sh
          bash script/sync_pdf_sidecar_binaries.sh
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"

      - name: verify bundled PDF sidecar
        run: |
          bash script/sync_pdf_sidecar_binaries.sh
          bash script/verify_pdf_sidecar_binary.sh
          ls -la textlingo-desktop/src-tauri/binaries
        shell: bash

      - name: stage PDF offline assets
        run: python script/build_pdf_offline_assets.py
        shell: bash

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenKoto Desktop ${{ github.ref_name }}"
          releaseBody: |
            ## Release Highlights
            - Added native `.srt` subtitle import for local video and audio materials.
            - Added a manual subtitle import action for existing media articles.
            - Added standalone subtitle-file import so `.srt` files can be read as regular materials.

            ## Changed
            - Subtitle import now uses a shared backend parsing pipeline across all entry points.
            - Local media import forms now support an optional subtitle attachment field.
            - Added reader/player controls to import or replace subtitles without cloud transcription.
            - Desktop version is bumped to `${{ github.ref_name }}` for this release.
            - Multi-platform GitHub release publishing remains tag-driven through this workflow.
          releaseDraft: false
          prerelease: false
          projectPath: "./textlingo-desktop"
          args: ${{ matrix.args }}

      - name: assert PDF sidecar entitlements (macos only)
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find textlingo-desktop/src-tauri/target -type d -name "*.app" -path "*/release/bundle/macos/*" | head -1)
          if [ -z "$APP" ]; then echo "::error::No .app bundle found"; exit 1; fi
          echo "App bundle: $APP"
          SIDECAR="$APP/Contents/MacOS/openkoto-pdf-translator"
          if [ ! -f "$SIDECAR" ]; then
            echo "::error::PDF sidecar not found at $SIDECAR"
            ls -la "$APP/Contents/MacOS" || true
            exit 1
          fi
          echo "--- signature ---"
          codesign -dvvv "$SIDECAR" 2>&1 | grep -iE "TeamIdentifier|Authority=|Signature" || true
          echo "--- entitlements ---"
          ENTS=$(codesign -d --entitlements - --xml "$SIDECAR" 2>/dev/null || codesign -d --entitlements - "$SIDECAR" 2>/dev/null || true)
          echo "$ENTS"
          if echo "$ENTS" | grep -q "disable-library-validation"; then
            echo "OK: disable-library-validation present on PDF sidecar"
          else
            echo "::error::disable-library-validation entitlement missing on PDF sidecar — PDF translation will fail at runtime"
            exit 1
          fi

      - name: assert notarization staple (macos only)
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find textlingo-desktop/src-tauri/target -type d -name "*.app" -path "*/release/bundle/macos/*" | head -1)
          if [ -z "$APP" ]; then echo "::error::No .app bundle found"; exit 1; fi
          echo "Validating staple on app: $APP"
          if xcrun stapler validate "$APP"; then
            echo "OK: .app carries a stapled notarization ticket"
          else
            echo "::error::.app is NOT stapled — quarantined users will see 'is damaged and can't be opened'"
            exit 1
          fi
          DMG=$(find textlingo-desktop/src-tauri/target -name "*.dmg" -path "*/release/bundle/dmg/*" | head -1)
          if [ -n "$DMG" ]; then
            echo "Validating staple on dmg: $DMG"
            if xcrun stapler validate "$DMG"; then
              echo "OK: .dmg carries a stapled notarization ticket"
            else
              echo "::warning::.dmg is not stapled; the .app inside is, which is normally sufficient"
            fi
          else
            echo "::warning::No .dmg found to validate staple"
          fi
